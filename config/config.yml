paths:
  alignment: "data/raw/alignment/41seqscollagen_Edited.fasta"
  tree: "data/raw/tree/41SEQSUPDATEDEDITEDMCC"
  partials: "data/raw/partials/"
  processed: "data/processed/"
  outputs: "outputs/"

analysis:
  min_clade_size: 2
  max_clade_frac: 0.95
  min_total_obs: 30
  min_side_obs: 2
  min_site_maf: 2
  min_gain_norm: 0.5
  chunk_size: 5000
  candidate_window_sizes:
    - 300
    - 500
    - 1000
    - 2000
  windows:
    widths:
      - 300
      - 500
      - 1000
      - 2000
    overlap: 0.5
    min_informative_snps: 1
    snp_centered:
      enabled: true
      widths:
        - 300
        - 500
  panel_selection:
    panel_sizes:
      - 1
      - 2
      - 3
      - 5
      - 10
    min_marginal_gain: 0
    min_informative_snps: 1
    min_total_weighted_gain: 0
    max_missing_fraction: null
    permitted_widths: null
    max_allowed_overlap: 0
    min_distance: null
    exclude_near_duplicates: false
    cap_repeated_coverage: true
    repeated_node_credit: 0
