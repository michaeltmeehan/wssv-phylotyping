# Example parameter set focused on diagnosing partial-genome classifications.
# Copy this file to config/config.yml before running. Review paths first.

paths:
  alignment: "data/raw/alignment/41seqscollagen_Edited.fasta"
  tree: "data/raw/tree/41SEQSUPDATEDEDITEDMCC"
  partials: "data/raw/partials/"
  processed: "data/processed/"
  outputs: "outputs/"

analysis:
  min_clade_size: 2
  max_clade_frac: 0.95
  min_target_posterior_support: 0.90
  target_clades:
    - node_id: 43
    - node_id: 44
    - node_id: 46
    - node_id: 47
  min_total_obs: 30
  min_side_obs: 2
  min_site_maf: 2
  min_gain_norm: 0.5
  chunk_size: 5000
  candidate_window_sizes: [300, 500, 1000, 2000]
  windows:
    widths: [300, 500, 1000, 2000]
    overlap: 0.5
    min_informative_snps: 1
    snp_centered:
      enabled: true
      widths: [300, 500]
  panel_selection:
    panel_sizes: [1, 2, 3, 5, 10]
    min_marginal_gain: 0
    min_informative_snps: 1
    min_total_weighted_gain: 0
    max_missing_fraction: null
    permitted_widths: null
    max_allowed_overlap: 0
    min_distance: null
    exclude_near_duplicates: false
    cap_repeated_coverage: true
    repeated_node_credit: 0
  validation:
    panel_sizes: [1, 2, 3, 5, 10]
    fragment_lengths: [300, 500, 1000, 2000, 5000]
    random_baseline_replicates: 10
    min_informative_sites: 1
    min_informative_nodes: 1
    random_seed: 1
  classifier:
    min_sites_per_node: 1
    min_total_informative_sites: 1
    min_support: 0.8
    max_conflict: 0.2
    support_margin: 0.05
    use_selected_panel: true
    panel_size: null
  partials:
    input_dir: "data/raw/partials/"
    # Reference alignment row used to map exact-substring and pairwise-local partials.
    reference_id: "CN01_1994"
    fasta_extensions: ["fa", "fas", "fasta", "fna"]
    mapping_mode: "auto"
    classification_mode: "auto"
    pairwise_local:
      min_identity: 0.85
      min_query_coverage: 0.6
      min_aligned_length: 20
      gap_opening: -10
      gap_extension: -0.5
    min_observed_informative_sites: 1
    min_support: 0.8
    min_support_margin: 0.05
    conflict_support_threshold: 0.2
    use_weighted_support: true
    # Only changed from default: write extra evidence rows so unresolved,
    # weak, and conflicting partial records can be diagnosed.
    write_unresolved_evidence: true
