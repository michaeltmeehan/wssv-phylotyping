# Example sensitive parameter set.
# Copy this file to config/config.yml before running. Review paths first.

paths:
  alignment: "data/raw/alignment/41seqscollagen_Edited.fasta"
  tree: "data/raw/tree/41SEQSUPDATEDEDITEDMCC"
  partials: "data/raw/partials/"
  processed: "data/processed/"
  outputs: "outputs/"

analysis:
  min_clade_size: 2
  max_clade_frac: 0.95
  min_target_posterior_support: 0.90
  target_clades:
    - node_id: 43
    - node_id: 44
    - node_id: 46
    - node_id: 47
  amplicons:
    primary_target_nodes: [43, 44, 46, 47]
    diagnostic_target_nodes: []
    min_length: 500
    max_length: 3000
    flank_search_width: 100
    strong_gain_threshold: 0.8
    minimum_gain_threshold: 0.5
    flank_min_non_missing_fraction: 0.9
    flank_max_variable_fraction: 0.25
    flank_min_gc_fraction: 0.35
    flank_min_conserved_fraction: 0.9
    flank_complete_fraction: 0.95
  # Lower total observation threshold admits more SNP rules for exploration.
  min_total_obs: 25
  min_side_obs: 2
  min_site_maf: 2
  # Lower gain threshold keeps weaker candidate SNPs; inspect conflicts carefully.
  min_gain_norm: 0.4
  chunk_size: 5000
  candidate_window_sizes: [300, 500, 1000, 2000]
  windows:
    widths: [300, 500, 1000, 2000]
    # More overlap creates more candidate windows around possible signal.
    overlap: 0.6
    min_informative_snps: 1
    snp_centered:
      enabled: true
      # Adds wider SNP-centred windows to increase chances of capturing signal.
      widths: [300, 500, 1000]
  panel_selection:
    panel_sizes: [2, 3, 4, 5, 6]
    min_panel_size: 2
    max_panel_size: 6
    top_n_panels: 20
    exact_enumeration_limit: 100000
    max_reduced_candidates: 30
    evidence_threshold: 0.5
    strong_evidence_threshold: 0.8
    max_candidate_length: 3000
    min_complete_fraction: 0.9
    max_missing_fraction: null
    require_left_flank_conserved: false
    require_right_flank_conserved: false
    require_both_flanks_conserved: false
    min_target_signal: null
    min_targets_with_signal: null
    min_targets_with_strong_signal: null
    max_ambiguity_fraction: null
    max_gap_fraction: null
    max_allowed_overlap: 0.25
    min_distance: null
    dominance_overlap_threshold: 0.85
    dominance_min_distance: 100
    local_redundancy_overlap_threshold: 0.9
    local_redundancy_min_distance: 100
    target_gain_round_digits: 3
  validation:
    panel_sizes: [1, 2, 3, 5, 10]
    fragment_lengths: [300, 500, 1000, 2000, 5000]
    random_baseline_replicates: 10
    min_informative_sites: 1
    min_informative_nodes: 1
    random_seed: 1
  classifier:
    min_sites_per_node: 1
    min_total_informative_sites: 1
    # Lower support, higher conflict tolerance, and no margin are permissive.
    min_support: 0.7
    max_conflict: 0.3
    support_margin: 0
    use_selected_panel: true
    panel_size: null
  partials:
    input_dir: "data/raw/partials/"
    # Use the same alignment row as the default config for partial coordinate mapping.
    reference_id: "CN01_1994"
    fasta_extensions: ["fa", "fas", "fasta", "fna"]
    mapping_mode: "auto"
    classification_mode: "auto"
    pairwise_local:
      # More permissive mapping can recover more partials but needs review.
      min_identity: 0.8
      min_query_coverage: 0.5
      min_aligned_length: 20
      gap_opening: -10
      gap_extension: -0.5
    min_observed_informative_sites: 1
    # Match the sensitive classifier posture for opportunistic partial calls.
    min_support: 0.7
    min_support_margin: 0
    conflict_support_threshold: 0.3
    use_weighted_support: true
    write_unresolved_evidence: false
