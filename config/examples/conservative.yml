# Example conservative parameter set.
# Copy this file to config/config.yml before running. Review paths first.

paths:
  alignment: "data/raw/alignment/41seqscollagen_Edited.fasta"
  tree: "data/raw/tree/41SEQSUPDATEDEDITEDMCC"
  partials: "data/raw/partials/"
  processed: "data/processed/"
  outputs: "outputs/"

analysis:
  min_clade_size: 2
  max_clade_frac: 0.95
  min_target_posterior_support: 0.90
  target_clades:
    - node_id: 43
    - node_id: 44
    - node_id: 46
    - node_id: 47
  # Stricter observation filters reduce rare or poorly observed SNP rules.
  min_total_obs: 35
  min_side_obs: 3
  min_site_maf: 3
  # Higher gain threshold keeps fewer, stronger SNP rules.
  min_gain_norm: 0.6
  chunk_size: 5000
  candidate_window_sizes: [300, 500, 1000, 2000]
  windows:
    # Drops 300 bp fixed windows so panel candidates are less sparse.
    widths: [500, 1000, 2000]
    overlap: 0.5
    # Require at least two informative SNPs per scored window.
    min_informative_snps: 2
    snp_centered:
      enabled: true
      widths: [300, 500]
  panel_selection:
    panel_sizes: [1, 2, 3, 5, 10]
    # Stop adding windows that contribute only negligible new node signal.
    min_marginal_gain: 0.1
    # Keep sparse windows out of the panel candidate pool.
    min_informative_snps: 2
    min_total_weighted_gain: 0
    # Exclude windows with high missingness in the complete-genome alignment.
    max_missing_fraction: 0.2
    permitted_widths: null
    max_allowed_overlap: 0
    min_distance: null
    exclude_near_duplicates: false
    cap_repeated_coverage: true
    repeated_node_credit: 0
  validation:
    panel_sizes: [1, 2, 3, 5, 10]
    fragment_lengths: [300, 500, 1000, 2000, 5000]
    # More random baselines gives a less noisy comparison at modest runtime cost.
    random_baseline_replicates: 25
    # Require more retained signal before counting a validation case as resolved.
    min_informative_sites: 2
    min_informative_nodes: 1
    random_seed: 1
  classifier:
    # Require more node rules and observed sites before classification.
    min_sites_per_node: 2
    min_total_informative_sites: 2
    # Higher support, lower conflict, and larger margin make calls stricter.
    min_support: 0.9
    max_conflict: 0.1
    support_margin: 0.1
    use_selected_panel: true
    panel_size: null
  partials:
    input_dir: "data/raw/partials/"
    # Use the same alignment row as the default config for partial coordinate mapping.
    reference_id: "CN01_1994"
    fasta_extensions: ["fa", "fas", "fasta", "fna"]
    mapping_mode: "auto"
    classification_mode: "auto"
    pairwise_local:
      # Stricter mapping reduces false placement risk for partial records.
      min_identity: 0.9
      min_query_coverage: 0.7
      min_aligned_length: 30
      gap_opening: -10
      gap_extension: -0.5
    # Match the conservative classifier thresholds for partial calls.
    min_observed_informative_sites: 2
    min_support: 0.9
    min_support_margin: 0.1
    conflict_support_threshold: 0.1
    use_weighted_support: true
    # Write extra diagnostics so rejected or weak partial calls can be audited.
    write_unresolved_evidence: true
